[project]
name = "epilink-ml-model"
version = "2.0.0"
description = "Dengue Risk Prediction ML Microservice for EpiLink - Academic Project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Charuka Karunarathna"}
]
keywords = ["dengue", "machine-learning", "forecasting", "public-health", "sri-lanka"]

dependencies = [
    # Core Data Science
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    
    # Machine Learning Models
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "catboost>=1.2.0",
    
    # Hyperparameter Optimization
    "optuna>=3.4.0",
    
    # Model Interpretability (optional due to Python 3.13 compatibility)
    "shap>=0.50.0",  # Uncomment if using Python 3.11 or 3.12
    
    # API Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Database
    "psycopg2-binary>=2.9.0",
    
    # Utilities
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.scripts]
# Training commands
train-legacy = "src.legacy.train_model:main"
train-enhanced = "src.enhanced.train:main"

# API server
serve = "src.api.app:run_server"

# Setup commands (run from project root)
setup = "src.cli.setup:setup_enhanced"
setup-enhanced = "src.cli.setup:setup_enhanced"
fetch-weather = "src.cli.setup:fetch_weather"

# Forecasting commands
forecast = "src.cli.setup:forecast"
backfill = "src.cli.setup:backfill"

# Database commands
db-health = "src.database.health_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]
