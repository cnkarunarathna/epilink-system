name: Deploy to Cloud Run

on:
    push:
        branches: [ deploy-gcp ]

env:
    REGION: asia-south1
    GCP_REGISTRY: asia-south1-docker.pkg.dev

jobs:
    deploy:
        name: Deploy services to Cloud Run
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                service:
                    - name: route-optimizer
                      context: route-optimizer
                      port: 8001
                      memory: 512Mi
                    - name: explain-analytics
                      context: explain-analytics
                      port: 8010
                      memory: 1Gi
                    - name: chatbot-service
                      context: chatbot-service
                      port: 8000
                      memory: 1Gi
                    - name: backend
                      context: backend
                      port: 3001
                      memory: 512Mi
                    - name: frontend
                      context: frontend
                      port: 3000
                      memory: 512Mi
        steps:
            - uses: actions/checkout@v4

            - name: Validate Workload Identity configuration
              env:
                  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
                  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
              run: |
                  if [[ -z "$WIF_PROVIDER" ]]; then
                    echo "::error::WIF_PROVIDER is empty. Set it to the full provider resource name, for example projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider."
                    exit 1
                  fi

                  if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
                    echo "::error::WIF_PROVIDER has the wrong format: $WIF_PROVIDER"
                    echo "::error::Use the full provider resource name from Google Cloud, not the display name or a project ID."
                    exit 1
                  fi

                  if [[ -z "$WIF_SERVICE_ACCOUNT" || ! "$WIF_SERVICE_ACCOUNT" =~ ^[^@]+@[^@]+\.iam\.gserviceaccount\.com$ ]]; then
                    echo "::error::WIF_SERVICE_ACCOUNT is missing or invalid: $WIF_SERVICE_ACCOUNT"
                    echo "::error::Use the deployer service account email, for example github-deployer@PROJECT_ID.iam.gserviceaccount.com."
                    exit 1
                  fi

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
                  service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.GCP_REGISTRY }} --quiet

            - name: Set up docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push ${{ matrix.service.name }} image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.service.context }}
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
                      CHATBOT_SERVICE_URL=${{ secrets.CHATBOT_SERVICE_URL }}
                  tags: |
                      ${{ env.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/epilink/${{ matrix.service.name }}:sha-${{ github.sha }}
                      ${{ env.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/epilink/${{ matrix.service.name }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy ${{ matrix.service.name }} to Cloud Run
              env:
                  BACKEND_URL: ${{ secrets.BACKEND_URL }}
                  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
                  EXPLAIN_ANALYTICS_URL: ${{ secrets.EXPLAIN_ANALYTICS_URL }}
                  ROUTE_OPTIMIZER_URL: ${{ secrets.ROUTE_OPTIMIZER_URL }}
                  OSRM_BASE_URL: ${{ secrets.OSRM_BASE_URL }}
                  REDIS_HOST: ${{ secrets.REDIS_HOST }}
                  REDIS_PORT: ${{ secrets.REDIS_PORT }}
                  REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
                  PGHOST: ${{ secrets.PGHOST }}
                  PGPORT: ${{ secrets.PGPORT }}
                  PGUSER: ${{ secrets.PGUSER }}
                  PGDATABASE: ${{ secrets.PGDATABASE }}
                  PGSSL: ${{ secrets.PGSSL }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
                  AWS_S3_URL: ${{ secrets.AWS_S3_URL }}
                  ZOHO_SMTP_HOST: ${{ secrets.ZOHO_SMTP_HOST }}
                  ZOHO_SMTP_PORT: ${{ secrets.ZOHO_SMTP_PORT }}
                  ZOHO_SMTP_SECURE: ${{ secrets.ZOHO_SMTP_SECURE }}
                  ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
                  EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
                  EMAIL_QUEUE_CONCURRENCY: ${{ secrets.EMAIL_QUEUE_CONCURRENCY }}
                  QDRANT_URL: ${{ secrets.QDRANT_URL }}
                  CHATBOT_QDRANT_COLLECTION_NAME: ${{ secrets.CHATBOT_QDRANT_COLLECTION_NAME }}
                  CHATBOT_DATA_DIR: ${{ secrets.CHATBOT_DATA_DIR }}
                  EXPLAIN_QDRANT_URL: ${{ secrets.EXPLAIN_QDRANT_URL }}
                  EXPLAIN_QDRANT_COLLECTION: ${{ secrets.EXPLAIN_QDRANT_COLLECTION }}
                  EXPLAIN_REDIS_URL: ${{ secrets.EXPLAIN_REDIS_URL }}
                  EXPLAIN_BACKEND_API_URL: ${{ secrets.EXPLAIN_BACKEND_API_URL }}
                  EXPLAIN_ENVIRONMENT: ${{ secrets.EXPLAIN_ENVIRONMENT }}
                  EXPLAIN_RAG_ENABLED: ${{ secrets.EXPLAIN_RAG_ENABLED }}
                  EXPLAIN_ENABLE_AGENT_MODE: ${{ secrets.EXPLAIN_ENABLE_AGENT_MODE }}
                  FASTAPI_ENV: ${{ secrets.FASTAPI_ENV }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  CHATBOT_SERVICE_URL: ${{ secrets.CHATBOT_SERVICE_URL }}
              run: |
                  ENV_FILE="$(mktemp)"
                  SECRET_ARGS=""
                  VPC_ARGS=""
                  BACKEND_ORIGIN_URL="${BACKEND_URL%/api}"

                  case "${{ matrix.service.name }}" in
                    backend)
                      printf '%s\n' \
                        "NODE_ENV: \"production\"" \
                        "PGHOST: \"$PGHOST\"" \
                        "PGPORT: \"$PGPORT\"" \
                        "PGUSER: \"$PGUSER\"" \
                        "PGDATABASE: \"$PGDATABASE\"" \
                        "PGSSL: \"$PGSSL\"" \
                        "REDIS_HOST: \"$REDIS_HOST\"" \
                        "REDIS_PORT: \"$REDIS_PORT\"" \
                        "REDIS_USERNAME: \"$REDIS_USERNAME\"" \
                        "OSRM_BASE_URL: \"$OSRM_BASE_URL\"" \
                        "EXPLAIN_ANALYTICS_URL: \"$EXPLAIN_ANALYTICS_URL\"" \
                        "ROUTE_OPTIMIZER_URL: \"$ROUTE_OPTIMIZER_URL\"" \
                        "NEXT_FRONTEND_URL: \"$FRONTEND_URL\"" \
                        "FRONTEND_URL: \"$FRONTEND_URL\"" \
                        "AWS_REGION: \"$AWS_REGION\"" \
                        "AWS_S3_BUCKET: \"$AWS_S3_BUCKET\"" \
                        "AWS_S3_URL: \"$AWS_S3_URL\"" \
                        "ZOHO_SMTP_HOST: \"$ZOHO_SMTP_HOST\"" \
                        "ZOHO_SMTP_PORT: \"$ZOHO_SMTP_PORT\"" \
                        "ZOHO_SMTP_SECURE: \"$ZOHO_SMTP_SECURE\"" \
                        "ZOHO_SMTP_USER: \"$ZOHO_SMTP_USER\"" \
                        "EMAIL_ENABLED: \"$EMAIL_ENABLED\"" \
                        "EMAIL_QUEUE_CONCURRENCY: \"$EMAIL_QUEUE_CONCURRENCY\"" \
                        "CHATBOT_SERVICE_URL: \"$CHATBOT_SERVICE_URL\"" \
                        > "$ENV_FILE"
                      SECRET_ARGS="--set-secrets=JWT_SECRET=JWT_SECRET:latest,PGPASSWORD=PGPASSWORD:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET=AWS_SECRET:latest,ZOHO_SMTP_PASS=ZOHO_SMTP_PASS:latest"
                      VPC_ARGS="--vpc-connector=epilink-connector --vpc-egress=private-ranges-only"
                      ;;
                    chatbot-service)
                      printf '%s\n' \
                        "NODE_ENV: \"production\"" \
                        "QDRANT_URL: \"$QDRANT_URL\"" \
                        "QDRANT_COLLECTION_NAME: \"$CHATBOT_QDRANT_COLLECTION_NAME\"" \
                        "DATA_DIR: \"$CHATBOT_DATA_DIR\"" \
                        > "$ENV_FILE"
                      SECRET_ARGS="--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,ADMIN_API_KEY=ADMIN_API_KEY:latest"
                      VPC_ARGS="--vpc-connector=epilink-connector --vpc-egress=private-ranges-only"
                      ;;
                    explain-analytics)
                      printf '%s\n' \
                        "NODE_ENV: \"production\"" \
                        "EXPLAIN_QDRANT_URL: \"$EXPLAIN_QDRANT_URL\"" \
                        "EXPLAIN_QDRANT_COLLECTION: \"$EXPLAIN_QDRANT_COLLECTION\"" \
                        "EXPLAIN_REDIS_URL: \"$EXPLAIN_REDIS_URL\"" \
                        "EXPLAIN_BACKEND_API_URL: \"$EXPLAIN_BACKEND_API_URL\"" \
                        "EXPLAIN_ENVIRONMENT: \"$EXPLAIN_ENVIRONMENT\"" \
                        "EXPLAIN_RAG_ENABLED: \"$EXPLAIN_RAG_ENABLED\"" \
                        "EXPLAIN_ENABLE_AGENT_MODE: \"$EXPLAIN_ENABLE_AGENT_MODE\"" \
                        > "$ENV_FILE"
                      SECRET_ARGS="--set-secrets=EXPLAIN_GEMINI_API_KEY=EXPLAIN_GEMINI_API_KEY:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest"
                      VPC_ARGS="--vpc-connector=epilink-connector --vpc-egress=private-ranges-only"
                      ;;
                    route-optimizer)
                      printf '%s\n' \
                        "NODE_ENV: \"production\"" \
                        "FASTAPI_ENV: \"$FASTAPI_ENV\"" \
                        > "$ENV_FILE"
                      ;;
                    frontend)
                      printf '%s\n' \
                        "NODE_ENV: \"production\"" \
                        "NEXT_PUBLIC_API_URL: \"$NEXT_PUBLIC_API_URL\"" \
                        "NEXT_PUBLIC_SOCKET_URL: \"$BACKEND_ORIGIN_URL\"" \
                        "CHATBOT_SERVICE_URL: \"$CHATBOT_SERVICE_URL\"" \
                        > "$ENV_FILE"
                      ;;
                  esac

                  gcloud run deploy epilink-${{ matrix.service.name }} \
                    --project=${{ secrets.GCP_PROJECT_ID }} \
                    --image=${{ env.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/epilink/${{ matrix.service.name }}:sha-${{ github.sha }} \
                    --region=${{ env.REGION }} \
                    --platform=managed \
                    --allow-unauthenticated \
                    --min-instances=0 \
                    --max-instances=3 \
                    --cpu=1 \
                    --memory=${{ matrix.service.memory }} \
                    --port=${{ matrix.service.port }} \
                    --env-vars-file="$ENV_FILE" \
                    $SECRET_ARGS \
                    $VPC_ARGS \
                    --quiet

    smoke-tests:
        name: Smoke tests
        runs-on: ubuntu-latest
        needs: [ deploy ]
        if: always()
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
                  service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Wait for services to be ready
              run: sleep 30

            - name: Test backend health
              run: |
                  BACKEND_URL=$(gcloud run services describe epilink-backend \
                    --project=${{ secrets.GCP_PROJECT_ID }} \
                    --region=asia-south1 \
                    --format='value(status.url)' 2>/dev/null || echo "")
                  if [ -z "$BACKEND_URL" ]; then
                    echo "Backend not deployed yet"
                    exit 0
                  fi
                  curl -sf "$BACKEND_URL/api/health" > /dev/null || exit 1

            - name: Test route-optimizer health
              run: |
                  ROUTE_URL=$(gcloud run services describe epilink-route-optimizer \
                    --project=${{ secrets.GCP_PROJECT_ID }} \
                    --region=asia-south1 \
                    --format='value(status.url)' 2>/dev/null || echo "")
                  if [ -z "$ROUTE_URL" ]; then
                    echo "Route optimizer not deployed yet"
                    exit 0
                  fi
                  curl -sf "$ROUTE_URL/health" > /dev/null || exit 1

            - name: Test frontend
              run: |
                  FRONTEND_URL=$(gcloud run services describe epilink-frontend \
                    --project=${{ secrets.GCP_PROJECT_ID }} \
                    --region=asia-south1 \
                    --format='value(status.url)' 2>/dev/null || echo "")
                  if [ -z "$FRONTEND_URL" ]; then
                    echo "Frontend not deployed yet"
                    exit 0
                  fi
                  curl -sf "$FRONTEND_URL" > /dev/null || exit 1
