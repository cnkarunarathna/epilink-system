name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ dev ]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov -- --ci --forceExit
        env:
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: backend/coverage/
          retention-days: 7

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: epilink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --forceExit
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/epilink_test
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [ backend-unit, backend-integration ]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  python-services:
    name: Python import checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ chatbot-service, explain-analytics, route-optimizer ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (hatch/uv)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          uv sync --no-dev
        working-directory: ${{ matrix.service }}

      - name: Import check
        run: |
          uv run python -c "import src" || uv run python -c "import app"
        working-directory: ${{ matrix.service }}

  docker-build:
    name: Docker build matrix
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend, python-services ]
    strategy:
      matrix:
        service:
          - { name: frontend, context: frontend }
          - { name: backend, context: backend }
          - { name: chatbot-service, context: chatbot-service }
          - { name: explain-analytics, context: explain-analytics }
          - { name: route-optimizer, context: route-optimizer }
    steps:
      - uses: actions/checkout@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
