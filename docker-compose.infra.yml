services:
  redis:
    image: redis:8-alpine
    container_name: epilink-redis
    restart: unless-stopped
    command:
      ["redis-server", "--requirepass", "ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx"]
    ports:
      - "11801:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: epilink-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  osrm:
    image: osrm/osrm-backend:latest
    container_name: epilink-osrm
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/sri-lanka-latest.osrm
    ports:
      - "5000:5000"

volumes:
  redisdata:
  qdrantdata:
