services:
  redis:
    image: redis:8-alpine
    container_name: epilink-redis
    restart: unless-stopped
    command:
      ["redis-server", "--requirepass", "ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx"]
    ports:
      - "11801:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: epilink-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  ml-model:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: epilink-ml-model
    restart: unless-stopped
    env_file:
      - ./ml-model/.env
    ports:
      - "8000:8000"

  explain-analytics:
    build:
      context: ./explain-analytics
      dockerfile: Dockerfile
    container_name: epilink-explain-analytics
    restart: unless-stopped
    env_file:
      - ./explain-analytics/.env
    environment:
      EXPLAIN_ENVIRONMENT: production
      EXPLAIN_BACKEND_API_URL: http://backend:3001/api
      EXPLAIN_QDRANT_URL: http://qdrant:6333
      EXPLAIN_QDRANT_COLLECTION: epilink_rag
      EXPLAIN_REDIS_URL: redis://default:ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx@redis:6379
      EXPLAIN_RAG_ENABLED: "true"
      EXPLAIN_ENABLE_AGENT_MODE: "true"
    depends_on:
      - qdrant
      - redis
    ports:
      - "8010:8010"

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: epilink-chatbot
    restart: unless-stopped
    env_file:
      - ./chatbot-service/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CHROMA_PERSIST_DIR: /app/chroma_db
      DATA_DIR: /app/data
    ports:
      - "8002:8000"
    volumes:
      - chatbot_chroma:/app/chroma_db

  route-optimizer:
    build:
      context: ./route-optimizer
      dockerfile: Dockerfile
    container_name: epilink-route-optimizer
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epilink-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      PGSSL: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx
      JWT_SECRET: epilink-dev-jwt-secret
      ML_SERVICE_URL: http://ml-model:8000
      EXPLAIN_ANALYTICS_URL: http://explain-analytics:8010
      ROUTE_OPTIMIZER_URL: http://route-optimizer:8001
      NEXT_FRONTEND_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - redis
      - ml-model
      - explain-analytics
      - route-optimizer
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epilink-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  redisdata:
  qdrantdata:
  chatbot_chroma:
