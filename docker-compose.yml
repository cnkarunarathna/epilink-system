services:
  redis:
    image: redis:8-alpine
    container_name: epilink-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx" ]
    ports:
      - "11801:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: epilink-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      disable: true

  ml-model:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: epilink-ml-model
    restart: unless-stopped
    env_file:
      - ./ml-model/.env

  explain-analytics:
    build:
      context: ./explain-analytics
      dockerfile: Dockerfile
    container_name: epilink-explain-analytics
    restart: unless-stopped
    env_file:
      - ./explain-analytics/.env
    environment:
      EXPLAIN_ENVIRONMENT: production
      EXPLAIN_BACKEND_API_URL: http://backend:3001/api
      EXPLAIN_QDRANT_URL: http://qdrant:6333
      EXPLAIN_QDRANT_COLLECTION: epilink_rag
      EXPLAIN_REDIS_URL: redis://default:ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx@redis:6379
      EXPLAIN_RAG_ENABLED: "true"
      EXPLAIN_ENABLE_AGENT_MODE: "true"
    depends_on:
      - qdrant
      - redis

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: epilink-chatbot
    restart: unless-stopped
    env_file:
      - ./chatbot-service/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: dengue_knowledge
    volumes:
      - ./chatbot-service/data:/app/data:ro
    depends_on:
      - qdrant
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  route-optimizer:
    build:
      context: ./route-optimizer
      dockerfile: Dockerfile
    container_name: epilink-route-optimizer
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
            urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  osrm:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: epilink-osrm
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/sri-lanka-latest.osrm
    ports:
      - "5000:5000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epilink-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      PGSSL: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ZytgpWDhcFeosIzeheccQsRj4Sq1BOqx
      ML_SERVICE_URL: http://ml-model:8000
      EXPLAIN_ANALYTICS_URL: http://explain-analytics:8010
      ROUTE_OPTIMIZER_URL: http://route-optimizer:8001
      OSRM_BASE_URL: http://osrm:5000
      NEXT_FRONTEND_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - redis
      - ml-model
      - explain-analytics
      - route-optimizer
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epilink-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      CHATBOT_SERVICE_URL: http://chatbot-service:8000
    depends_on:
      - backend
      - chatbot-service
    ports:
      - "3000:3000"

volumes:
  redisdata:
  qdrantdata:
