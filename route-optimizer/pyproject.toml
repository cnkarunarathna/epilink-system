[project]
name = "epilink-route-optimizer"
version = "1.0.0"
description = "Route optimization microservice for EpiLink PHI task management"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Charuka Karunarathna"}
]
keywords = ["route-optimization", "tsp", "or-tools", "public-health", "sri-lanka"]

dependencies = [
    "ortools>=9.10",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
